<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI College Matchmaker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="badge">GitHub Multi-Dataset Engine</div>
    <h1>AI College Matchmaker</h1>
    <p>Ask in plain English—our AI agent cross-references <code>colleges.csv</code>, <code>majors.csv</code>, and <code>region_climate.csv</code> to find your best fit.</p>
  </header>

  <main>
    <section class="ai-card">
      <div class="api-bar">
        <label for="apiKeyInput">Optional Gemini API Key (for LLM reasoning):</label>
        <input type="password" id="apiKeyInput" placeholder="Paste key or leave blank for built-in smart agent" />
      </div>

      <textarea id="userQuery" rows="3" placeholder="e.g., I want a medium-sized robotics or engineering college somewhere with four seasons and snow..."></textarea>

      <div class="example-prompts">
        <span>Try:</span>
        <button type="button" class="pill" data-prompt="Small engineering school in a warm climate">Warm + Small Engineering</button>
        <button type="button" class="pill" data-prompt="Large computer science university in the Southeast">Large CS in Southeast</button>
        <button type="button" class="pill" data-prompt="Medium robotics college with cold winters">Medium Robotics + Cold</button>
      </div>

      <div class="actions">
        <button id="searchBtn" class="primary-btn">Find My Colleges</button>
        <button id="resetBtn" class="secondary-btn">Reset Filters</button>
      </div>

      <div id="agentReasoning" class="agent-box hidden"></div>
    </section>

    <div class="results-header">
      <h2 id="resultsTitle">All Colleges</h2>
      <span id="resultsCount" class="count-pill">0 schools</span>
    </div>

    <section id="resultsGrid" class="results-grid"></section>
  </main>

  <footer>
    <p>Powered by relational CSV datasets hosted on GitHub Pages.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
